<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ARC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Nunito:wght@700;800&display=swap">
<style>
:root{--bg:#141a3a;--ink:#f7f6ff;--muted:#b8bde0;--opp:#ff8a1f;--mango:#ffc04d;--coral:#ff5f7e;--aqua:#2fd6d0;--violet:#a78bfa}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(900px 600px at 20% 10%,color-mix(in srgb,var(--opp) 35%,transparent),transparent 60%),radial-gradient(800px 600px at 85% 20%,color-mix(in srgb,var(--violet) 40%,transparent),transparent 60%),radial-gradient(800px 600px at 50% 100%,color-mix(in srgb,var(--aqua) 30%,transparent),transparent 60%),var(--bg);color:var(--ink);font-family:"Nunito","Segoe UI",Helvetica,Arial,sans-serif;display:grid;place-items:center;padding:16px}
.card{width:min(440px,100%);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:24px;padding:28px 26px;backdrop-filter:blur(10px);box-shadow:0 30px 60px rgba(0,0,0,.35);text-align:center;animation:rise .6s ease both}
.logo{font-family:"Bricolage Grotesque",Arial,sans-serif;font-weight:800;font-size:72px;line-height:1;background:linear-gradient(90deg,var(--opp),var(--coral),var(--violet),var(--aqua));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-weight:800;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-size:12px;margin:4px 0 18px}
p{margin:0 0 14px;color:var(--muted);font-weight:700}
input{width:100%;font:inherit;font-weight:800;font-size:18px;text-align:center;color:var(--ink);background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);border-radius:999px;padding:12px 16px;letter-spacing:.08em}
input:focus{outline:3px solid var(--mango);border-color:var(--mango)}
button{margin-top:12px;width:100%;font:inherit;font-weight:800;font-size:16px;border:none;border-radius:999px;padding:12px;background:var(--opp);color:#1b1f3b;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--coral);font-weight:800;min-height:22px;margin-top:10px}
label.rem{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:12px;font-size:13px;color:var(--muted);font-weight:800}
.shake{animation:shake .4s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>
<body>
<form class="card" id="f">
  <div class="logo">ARC</div>
  <div class="sub">password</div>
  <input id="pw" type="password" autocomplete="current-password" placeholder="" autofocus aria-label="Password">
  <button id="go" type="submit">Enter →</button>
  <div class="err" id="err"></div>
  <label class="rem"><input type="checkbox" id="rem" style="width:auto"> Remember on this device</label>
</form>

async function decrypt(pw){const raw=b64(PAYLOAD);if(new TextDecoder().decode(raw.slice(0,8))!=="Salted__")throw new Error("bad");const salt=raw.slice(8,16),data=raw.slice(16);
